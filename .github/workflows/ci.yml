name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Test, security, D2 & Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Compile Python
        run: |
          python -m py_compile \
            app.py \
            init_db.py \
            course_migrations.py \
            reader_migrations.py \
            import_public_domain_books.py \
            smoke_test.py

      - name: Flask smoke test
        env:
          SECRET_KEY: ci-only-secret-key
        run: python smoke_test.py

      - name: Dependency security audit
        run: pip-audit -r requirements.txt

      - name: Secret-pattern scan
        run: python scripts/secret_scan.py

      - name: Install D2
        run: curl -fsSL https://d2lang.com/install.sh | sh -s --

      - name: Validate and render D2
        run: |
          set -euo pipefail
          mkdir -p build/diagrams
          d2 static/course_map.d2 build/diagrams/course-map.svg
          for f in docs/diagrams/*.d2; do
            d2 "$f" "build/diagrams/$(basename "${f%.d2}").svg"
          done

      - name: Create CI environment
        run: |
          cat > .env <<'EOF'
          SECRET_KEY=ci-only-not-production
          EOF

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build production image
        run: docker build -t physics-reality-tutor:ci .

      - name: Container health smoke test
        run: |
          set -euo pipefail
          docker run -d --name physics-reality-ci \
            -e SECRET_KEY=ci-container-secret \
            -p 127.0.0.1:15088:5088 \
            physics-reality-tutor:ci
          trap 'docker logs physics-reality-ci || true; docker rm -f physics-reality-ci || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:15088/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          curl -fsS http://127.0.0.1:15088/health
