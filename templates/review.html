{% extends 'base.html' %}{% block content %}<h1>Spaced Review</h1>{% if q %}<div class="card"><span class="pill">{{q.lesson_title}}</span><h2>{{q.prompt}}</h2><form method="post"><input type="hidden" name="question_id" value="{{q.id}}">{% for o in q.options %}<label class="option"><input type="radio" name="answer" value="{{o}}" required> {{o}}</label>{% endfor %}<label>Confidence <b id="confOut">50%</b><input id="conf" type="range" min="25" max="100" step="25" name="confidence" value="50" oninput="confOut.textContent=this.value+'%'"/></label><button>Check & schedule next review</button></form></div>{% else %}<div class="card"><h2>Review queue clear ✓</h2><p class="muted">No concepts are due right now.</p></div>{% endif %}{% endblock %}
