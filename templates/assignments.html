{% extends 'base.html' %}{% block content %}<h1>Assignments</h1>{% for a in assignments %}<div class="card"><h2>{{a['title']}}</h2><p>{{a['description']}}</p><p>{% if a['best_score'] is not none %}Best score: <b>{{a['best_score']}}%</b>{% else %}<span class="muted">Not attempted</span>{% endif %}</p><a class="btn" href="{{url_for('assignment',aid=a['id'])}}">Begin</a></div>{% endfor %}{% endblock %}
