{% extends 'base.html' %}{% block content %}<h1>Course Content</h1><div class="card"><h2>Add Lesson</h2><form method="post" action="{{url_for('admin_add_lesson')}}"><label>Title<input name="title" required></label><label>Unit<input name="unit" value="Custom"></label><label>Question<textarea name="question"></textarea></label><label>Proposition<textarea name="proposition"></textarea></label><label>Counter-Proposition<textarea name="counter_proposition"></textarea></label><label>Restatement<textarea name="restatement"></textarea></label><label>Reading / lesson introduction<textarea name="reading"></textarea></label><label>Manim animation slug<input name="animation_slug" placeholder="limited_rendering"></label><button>Add lesson</button></form></div><div class="card"><h2>Current Lessons</h2>{% for l in lessons %}<p>{{l['position']}}. <b>{{l['title']}}</b> <span class="muted">{{l['unit']}}</span></p>{% endfor %}</div>{% endblock %}
